name: deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: release-deploy-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      tag: ${{ steps.publish.outputs.tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version increment
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^breaking:[[:space:]]+[^[:space:]] ]]; then
            BUMP=major
          elif [[ "$PR_TITLE" =~ ^feat:[[:space:]]+[^[:space:]] ]]; then
            BUMP=minor
          elif [[ "$PR_TITLE" =~ ^fix:[[:space:]]+[^[:space:]] ]]; then
            BUMP=patch
          else
            echo "::error::Title must begin with fix:, feat: or breaking:"
            exit 1
          fi

          echo "type=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Compute next version from tags
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.type }}
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          CURRENT=${LATEST_TAG#v}
          CURRENT=${CURRENT:-0.0.0}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Publish tag
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "refs/tags/$TAG"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout released sources
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package Lambdas
        shell: bash
        run: |
          mkdir -p artifacts
          zip -j artifacts/psn-fetcher.zip dist/fetcher.mjs
          zip -j artifacts/psn-refresher.zip dist/refresher.mjs

      - name: Extract semantic version
        id: version
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: echo "version=${TAG# v}" >> "$GITHUB_OUTPUT"

      - name: Deploy Fetcher
        uses: ./.github/actions/deploy-lambda
        with:
          function_name: trophyquest-psn-fetcher
          semantic_version: ${{ steps.version.outputs.version }}
          alias_name: prod
          zip_path: artifacts/psn-fetcher.zip
          aws_region: ${{ secrets.AWS_REGION }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

      - name: Deploy Refresher
        uses: ./.github/actions/deploy-lambda
        with:
          function_name: trophyquest-psn-refresher
          semantic_version: ${{ steps.version.outputs.version }}
          alias_name: prod
          zip_path: artifacts/psn-refresher.zip
          aws_region: ${{ secrets.AWS_REGION }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
